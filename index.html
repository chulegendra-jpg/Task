<!doctype html>
<html lang="en" data-theme="dark" data-anim="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090B">
  <meta name="description" content="Streakwise: a personal daily planner for school, programming and English, built around real progress and streaks.">
  <title>Streakwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;600;700&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23B8F52A'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='%230c1004' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">Skip to content</a>
  <div id="app">
    <main id="main" tabindex="-1">
      <section class="page" id="page-home" data-page="home" aria-label="Home"></section>
      <section class="page" id="page-tasks" data-page="tasks" aria-label="Tasks"></section>
      <section class="page" id="page-calendar" data-page="calendar" aria-label="Calendar"></section>
      <section class="page" id="page-settings" data-page="settings" aria-label="Settings"></section>
    </main>

    <nav id="nav" class="nav" aria-label="Main">
      <button type="button" data-action="go" data-page="home" aria-current="page" title="Home · خانه">
        <svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl"><span>Home</span></span></button>
      <button type="button" data-action="go" data-page="tasks" aria-current="false" title="Tasks · وظایف">
        <svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg><span class="lbl"><span>Tasks</span></span></button>
      <button type="button" data-action="go" data-page="calendar" aria-current="false" title="Calendar · تقویم">
        <svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="lbl"><span>Calendar</span></span></button>
      <button type="button" data-action="go" data-page="settings" aria-current="false" title="Settings · تنظیمات">
        <svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="lbl"><span>Settings</span></span></button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>
  <input type="file" id="file-avatar" accept="image/*" hidden>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
